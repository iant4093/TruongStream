[workspace]
resolver = "2"
members = [
    "core",
    "platform-macos",
    "platform-windows",
    "app-ui/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Ian Truong"]
rust-version = "1.82"

[workspace.dependencies]
rusb = "0.9"
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
bytemuck = { version = "1.20", features = ["derive"] }
cc = "1.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
libc = "0.2"
ctrlc = "3.4"
tauri = { version = "2.2", features = ["macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-updater = "2.2"
tauri-plugin-process = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# Proc-macros are dlopen'ed at compile time; stripping them breaks loading on macOS.
[profile.release.build-override]
strip = false
